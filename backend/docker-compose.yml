version: "3.8"

services:
    nginx:
        image: nginx:alpine
        container_name: hr_load_balancer
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - api

    api:
        build: .
        deploy:
            replicas: 3
        environment:
            - PORT=3000
            - DB_HOST=postgres

    postgres:
        image: postgres:16-alpine
        container_name: hr_postgres
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
